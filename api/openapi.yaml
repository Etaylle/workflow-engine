openapi: 3.0.3
info:
  title: Workflow Engine API
  version: 0.1.0
  description: Written first; the backend and the frontend follow this file.
servers:
  - url: /
paths:
  /api/status:
    get:
      operationId: getStatus
      summary: Name, build id and time of the running engine
      responses:
        "200":
          description: The engine answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatus"
  /api/ai/check:
    post:
      operationId: checkAiConnection
      summary: Make one tiny call with a key (typed, or the saved one) and keep a typed key for the session
      description: >
        The key is held in engine memory only (never stored, never logged). On success the key
        stays for the session; on failure nothing changes: a key saved earlier stays, and the key that was typed is not kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCheckRequest"
      responses:
        "200":
          description: Claude answered with this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCheckResult"
        "400":
          description: No key given
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Anthropic rejected the key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic could not be reached or failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/ai/keys:
    get:
      operationId: getAiKeys
      summary: The keys of the session (never the keys themselves), the active planning provider and the defaults
      responses:
        "200":
          description: The state of the keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiKeys"
  /api/ai/keys/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [anthropic, openai]
        description: anthropic, or openai for any OpenAI-compatible provider (Gemini, OpenAI, Groq, OpenRouter, ...)
    put:
      operationId: setAiKey
      summary: Replace the key of one provider without calling the AI
      description: >
        Held in engine memory only (never stored, never logged). For openai, baseUrl (https, or http
        for localhost) and model are kept with the key; blank means the defaults of the engine
        (ENGINE_OPENAI_BASE_URL, ENGINE_OPENAI_MODEL). Use checkAiConnection to test a key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAiKeyRequest"
      responses:
        "200":
          description: The key is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiKeys"
        "400":
          description: No key, unknown provider, or a base URL that is not allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteAiKey
      summary: Remove the key of one provider from engine memory
      responses:
        "204":
          description: The key is gone
  /api/ai/planning:
    put:
      operationId: choosePlanningProvider
      summary: Choose which provider the planning calls use when both keys are set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [anthropic, openai]
      responses:
        "200":
          description: The choice is kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiKeys"
  /api/projects:
    post:
      operationId: createProject
      summary: Create a project from a wish; the Anthropic key, if given, is kept for the session
      description: The key is held in engine memory only (never stored, never logged).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: The project exists (status draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The wish is empty or too long
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listProjects
      summary: "All projects, newest first (no login, everyone sees all)"
      responses:
        "200":
          description: The projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /api/projects/{id}:
    get:
      operationId: getProject
      summary: One project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateProject
      summary: Change the name, the wish and/or the builder; a changed wish moves the project back to draft
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of name, wish and agentHarness
              properties:
                agentHarness:
                  type: string
                  enum: [claude_code, gemini_cli]
                  description: >
                    The builder of the project's software. A run remembers the builder it started with,
                    so changing it never affects a run under way or its resume
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                wish:
                  type: string
                  minLength: 1
                  maxLength: 20000
      responses:
        "200":
          description: The changed project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Nothing to change, or the name or wish is blank or too long
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteProject
      summary: Delete a project with its questions, requirements, workflow and contracts
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/workflow:
    post:
      operationId: generateWorkflow
      summary: Claude writes the business workflow from the wish, the answers and the requirements (one planning call, one retry; needs the requirements)
      description: >
        Replaces the draft workflow of the project; its status becomes valid. A confirmed
        contract is never touched.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The validated workflow with positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          description: Anthropic rejected the key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No Anthropic key is set for this session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Anthropic rate limit or credit exhausted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic failed, or the workflow was invalid twice
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: editWorkflow
      summary: Replace the workflow by the one the client edited (same rules as Claude's draft)
      description: >
        Allowed once a workflow exists. The status becomes valid; a confirmed contract is never
        touched, and confirming again makes the next version. Node keys only link the edges.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "200":
          description: The stored workflow with positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          description: A rule is broken (one start, an end, known lanes, reachable, no dead ends)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The project has no workflow yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getWorkflow
      summary: The current workflow of the project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: No such project, or no workflow yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/workflow/confirm:
    post:
      operationId: confirmWorkflow
      summary: Freeze the valid workflow as the next contract version
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: The new contract version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No workflow, or it is already confirmed and unchanged
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/contracts:
    get:
      operationId: listContracts
      summary: The confirmed contract versions of the project, oldest first
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/brief:
    post:
      operationId: generateBrief
      summary: Write the brief of the wish (one Claude call; only while the project is a draft)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The Anthropic key was rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No key, or the project is not at the right step
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Anthropic rate limit or credit used up
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic failed, or the answer was invalid twice
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getBrief
      summary: The brief of the project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: No such project, or no brief yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/questions:
    post:
      operationId: generateQuestions
      summary: Research the wish and ask at most 8 questions, each with the AI proposal (replaces earlier questions; needs the brief)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The questions; project status questions_ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The Anthropic key was rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No key, or the project is not at the right step
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Anthropic rate limit or credit used up
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic failed, or the answer was invalid twice
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getQuestions
      summary: The questions of the project with the answers given so far
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The questions (empty list when none were asked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/question-items:
    post:
      operationId: addQuestion
      summary: Add a question written by the client (at most 8 in all; only while the questions wait for answers)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: All questions of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        "400":
          description: The question is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Not open for changes, or 8 questions already
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/question-items/{questionId}:
    put:
      operationId: editQuestion
      summary: Rewrite one question; its answer is dropped
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "200":
          description: All questions of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        "400":
          description: The question is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such question
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Not open for changes
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteQuestion
      summary: Delete one question with its answer
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/QuestionId"
      responses:
        "200":
          description: The remaining questions, renumbered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        "404":
          description: No such question
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Not open for changes
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/answers:
    put:
      operationId: saveAnswers
      summary: Save one answer for every question (the client's value, or the AI proposal); project status answered
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAnswersRequest"
      responses:
        "200":
          description: The questions with their answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        "400":
          description: An answer is missing or not one of the options
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: There are no questions, or the requirements are already written
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/requirements:
    post:
      operationId: generateRequirements
      summary: Write the requirements from the wish and the answers (replaces earlier ones); project status requirements_ready
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The requirements grouped by epic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirements"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The Anthropic key was rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No key, or the project is not at the right step
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Anthropic rate limit or credit used up
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic failed, or the answer was invalid twice
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getRequirements
      summary: The requirements of the project (no epics when none were written)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The requirements grouped by epic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirements"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/documents/{kind}:
    get:
      operationId: getDocument
      summary: View the requirements document (kind requirements) or the project plan (kind plan), built from what the project holds now
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [requirements, plan]}
      responses:
        "200":
          description: The document as title and sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: No such project or document kind
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The requirements or the workflow are not written yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/documents/{kind}/download:
    get:
      operationId: downloadDocument
      summary: Download a document as DOCX or Markdown (PDF is not offered yet)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [requirements, plan]}
        - name: format
          in: query
          schema: {type: string, enum: [docx, md], default: docx}
      responses:
        "200":
          description: The file
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: {type: string, format: binary}
            text/markdown:
              schema: {type: string}
        "400":
          description: Unknown format
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project or document kind
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The requirements or the workflow are not written yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/builders:
    get:
      operationId: getBuilders
      summary: What each builder needs to build, and whether it has it
      description: >
        For Claude Code and Gemini CLI: installed (with version), the key set in the session, for
        Claude Code the sign-in mode and whether this machine is signed in ("unknown" when the
        installed `claude auth status` gives no answer; the first step's error then tells), and
        `missing`: one entry per missing prerequisite with a stable code, a message and, for a
        sign-in that only the owner can do, an instructionKey (message key of the frontend; the
        engine cannot perform the interactive Anthropic login, the instruction is to run `claude`
        once in a terminal on this machine and log in). `demo` is true when the stub builds
        everything (ENGINE_AI_STUB without ENGINE_EXECUTION_REAL_BUILDER); a real engine uses the
        real builders without any further setting. Probe results are cached for 30 seconds;
        refresh=true looks again.
      parameters:
        - name: refresh
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The builders in the order claude_code, gemini_cli
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Builders"
  /api/builders/claude_code/auth:
    put:
      operationId: setClaudeCodeAuth
      summary: Choose how Claude Code authenticates (kept in engine memory like the keys)
      description: >
        anthropic_key = the Anthropic key of the session goes to Claude Code as ANTHROPIC_API_KEY;
        machine_sign_in = Claude Code uses the sign-in of this machine and no key is passed. The
        start value comes from ENGINE_EXECUTION_USE_SIGN_IN (default anthropic_key).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [anthropic_key, machine_sign_in]}
      responses:
        "200":
          description: The builders after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Builders"
        "400":
          description: Unknown mode
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/runs:
    post:
      operationId: startRun
      summary: Start a run on the latest confirmed contract (only when the project is confirmed)
      description: >
        Returns at once with the run in status preparing; the build goes on in the background.
        The tasks are the software tasks of the contract in workflow order, each built by the
        steps of the project's step profile and stops at its cost limit (project settings). The run uses
        the project's builder (agentHarness) and remembers it. Claude Code needs the Anthropic key of the
        session or the machine sign-in mode; Gemini CLI needs the Gemini key (the OpenAI-compatible key slot
        set to Google Gemini); both need the command installed (`GET /api/builders`).
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: The run was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          description: >
            Not confirmed, a run is active, no software task, or the builder is not ready: the title is
            "Builder not ready: Claude Code" or "Builder not ready: Gemini CLI" and the detail names
            exactly what is missing (not installed, Anthropic key, not signed in, Gemini key)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/runs/latest:
    get:
      operationId: getLatestRun
      summary: The newest run of the project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The run with tasks, steps and cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: No such project, or it has no run yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}:
    get:
      operationId: getRun
      summary: Snapshot of a run (state, tasks, steps, cost, last event number)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: No such run
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/events:
    get:
      operationId: listRunEvents
      summary: Events of a run after a sequence number (at most 1000, oldest first), or a page of older ones
      description: >
        With `before`, the latest `limit` events with a smaller number are returned, oldest first
        (scrolling back in the console; pass a very large number for the newest ones); `after` is
        then ignored. `kind=console` keeps only console lines.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after
          in: query
          schema: {type: integer, format: int64, default: 0}
        - name: before
          in: query
          schema: {type: integer, format: int64}
        - name: kind
          in: query
          schema: {type: string, enum: [console, run, task, step]}
        - name: limit
          in: query
          description: Page size with `before` (1 to 1000)
          schema: {type: integer, default: 200, minimum: 1, maximum: 1000}
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunEvent"
        "404":
          description: No such run
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/stream:
    get:
      operationId: streamRunEvents
      summary: Server-sent events of a run, replayed from a sequence number, then live
      description: >
        The events after `after` (or after the header Last-Event-ID, which browsers send when they
        reconnect) are sent first, then new ones as they happen. The `id` of each event is its
        sequence number. The stream ends after ten minutes; the client reconnects.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after
          in: query
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema: {type: string}
        "404":
          description: No such run
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/answer:
    post:
      operationId: answerRunQuestion
      summary: Answer the open question of a waiting run; the run continues with the answer
      description: >
        retry builds the step again (the optional hint is told to the builder); skip marks the step
        done without building it; stop ends the run as failed (like the stop operation). The run asks only when a defect is not fixable after the fix
        attempts.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, choice]
              properties:
                questionId: {type: string, format: uuid}
                choice: {type: string, enum: [retry, skip, stop]}
                hint: {type: string, maxLength: 1000}
      responses:
        "200":
          description: The run, executing again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Unknown choice or hint too long
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The run is not waiting for this question, or there is no key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such run
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/stop:
    post:
      operationId: stopRun
      summary: Stop the run (the client's decision; the only way a run ends failed)
      description: >
        Ends a build under way at once, resets the workspace to the last green checkpoint and sets
        the run to failed with the reason "Stopped by the client". What was built up to the
        checkpoint can be downloaded as ZIP. Allowed while preparing, executing, waiting or
        interrupted.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run, failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: No such run
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The run has ended already
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/resume:
    post:
      operationId: resumeRun
      summary: Continue an interrupted or waiting run from the last checkpoint
      description: >
        Continues an interrupted run, a run waiting for tokens that has stopped retrying by itself,
        or a run waiting at its cost limit (then costLimitUsd is required and must leave room, at
        least the cost so far plus USD 0.30; 400 otherwise). After an engine restart the key is
        gone: enter it again first (409 "No Anthropic key" otherwise). The workspace is reset to the
        last commit, the step that was under way is built again. An interrupted run is resumed at
        most 3 times; the next interruption ends it failed.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                costLimitUsd: {type: number}
      responses:
        "200":
          description: The run, executing again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: No such run
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: The new cost limit leaves no room
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Cannot continue now, no key, contract changed, or resumed 3 times already
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/zip:
    get:
      operationId: downloadRunZip
      summary: The workspace of the run as ZIP (without .git, build output and node_modules)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The ZIP
          content:
            application/zip:
              schema: {type: string, format: binary}
        "404":
          description: No such run, or its workspace is gone
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The run is still preparing or building
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/checkpoints:
    get:
      operationId: listRunCheckpoints
      summary: The checkpoints (git commits) of the run workspace, newest first, with changed files
      description: >
        At most the latest 100 commits; per commit at most 300 files with lines added and removed
        (binary files have 0 and `binary` true). Read from the git history of the workspace, so a
        step that is still being built shows only after it is green.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The checkpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Checkpoint"
        "404":
          description: No such run, or its workspace is gone
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/files:
    get:
      operationId: listRunFiles
      summary: The files of the workspace at a checkpoint (read-only, at most 5000)
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: ref
          in: query
          description: HEAD (the latest checkpoint, default) or a commit id from the checkpoints
          schema: {type: string}
      responses:
        "200":
          description: The files with their sizes, sorted by path
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceFile"
        "400":
          description: The checkpoint is not HEAD or a commit id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such run, or its workspace is gone
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/file:
    get:
      operationId: getRunFile
      summary: The text of one workspace file at a checkpoint (text only, at most 256 KiB)
      description: >
        Read from the git history, never from the folder. The path must be relative, without `.`,
        `..`, empty parts or backslashes (400). Binary files and files over 256 KiB come without
        content (`binary` or `tooLarge` true).
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: path
          in: query
          required: true
          schema: {type: string}
        - name: ref
          in: query
          schema: {type: string}
      responses:
        "200":
          description: The file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFileContent"
        "400":
          description: Bad path or checkpoint
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such run or file
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/runs/{runId}/report:
    get:
      operationId: getRunReport
      summary: The final report of a run, built from the run's own data
      description: >
        Tasks, steps, attempts, cost, minutes, checkpoints and the questions the run asked the
        client. Available at any time (a run under way shows what is known so far); the same
        report is in the ZIP as REPORT.md.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReport"
        "404":
          description: No such run
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/settings/step-profiles:
    get:
      operationId: listStepProfiles
      summary: The step profiles (the development steps of a task, as data) with their steps
      responses:
        "200":
          description: The seeded profiles (short, 16 steps) and the client's own
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StepProfile"
    post:
      operationId: copyStepProfile
      summary: Copy a profile as the client's own, editable profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromId, name]
              properties:
                fromId: {type: string, format: uuid}
                name: {type: string, maxLength: 60}
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepProfile"
        "400":
          description: Name empty or too long, or already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such profile
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/settings/step-profiles/{profileId}:
    put:
      operationId: updateStepProfile
      summary: Replace the name and the steps (edit, reorder) of the client's own profile
      description: >
        Only a copy can be edited; the seeded profiles answer 409. Steps need unique keys, a title,
        a cost cap above 0 and at most 10 USD, and a prompt of at most 4000 characters; 1 to 20 steps.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepProfileEdit"
      responses:
        "200":
          description: The profile as saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepProfile"
        "400":
          description: A rule of the steps is broken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such profile
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A seeded profile cannot be edited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteStepProfile
      summary: Delete the client's own profile (projects that chose it use the default again)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "204":
          description: Deleted
        "404":
          description: No such profile
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A seeded profile cannot be deleted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/settings:
    get:
      operationId: getProjectSettings
      summary: The step profile and the cost limit of the project's runs
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The settings; a project that chose nothing has the default profile and limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettings"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: updateProjectSettings
      summary: Choose the step profile and the cost limit per run (a null value means the default)
      description: >
        A run copies the profile and takes the limit when it starts; changing the settings later
        does not change a run under way.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stepProfileId: {type: [string, "null"], format: uuid}
                costLimitUsd: {type: [number, "null"], minimum: 1, maximum: 1000}
      responses:
        "200":
          description: The settings as saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettings"
        "400":
          description: Unknown profile or limit out of range
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateProjectRequest:
      type: object
      required: [wish]
      properties:
        wish:
          type: string
          maxLength: 20000
        name:
          type: string
          maxLength: 120
          description: Optional; without it the name is the start of the wish
        apiKey:
          type: string
          description: Optional; kept in memory for the session
    Project:
      type: object
      required: [id, name, wish, status, agentHarness, model, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: The start of the wish}
        wish: {type: string}
        status:
          type: string
          enum: [draft, questions_ready, answered, requirements_ready, workflow_drafted, confirmed, executing, done, stopped, failed]
        agentHarness:
          type: string
          enum: [claude_code, gemini_cli]
          description: The builder of the software of this project (default claude_code)
        model: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Brief:
      type: object
      required: [goal, actors, domainTerms, risks]
      properties:
        goal: {type: string}
        actors: {type: array, items: {type: string}}
        domainTerms: {type: array, items: {type: string}}
        risks: {type: array, items: {type: string}}
    Questions:
      type: array
      maxItems: 8
      items:
        $ref: "#/components/schemas/Question"
    Question:
      type: object
      required: [id, seq, category, answerType, text, options, proposal]
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        category: {type: string, enum: [requirement, feature]}
        answerType: {type: string, enum: [single_choice, multiple_choice, text]}
        text: {type: string}
        options: {type: array, items: {type: string}}
        proposal:
          description: The AI's proposed answer, preselected for the client; a string, or an array of strings for multiple_choice
        explanation: {type: string, nullable: true}
        answer:
          nullable: true
          type: object
          required: [value, decidedBy]
          properties:
            value:
              description: A string, or an array of strings for multiple_choice
            decidedBy: {type: string, enum: [client, ai]}
    QuestionInput:
      type: object
      required: [category, answerType, text, options, proposal]
      properties:
        category: {type: string, enum: [requirement, feature]}
        answerType: {type: string, enum: [single_choice, multiple_choice, text]}
        text: {type: string}
        options: {type: array, items: {type: string}, description: 2 to 6 for the choice types, empty for text}
        proposal: {type: array, items: {type: string}, description: One element for single_choice and text, one or more options for multiple_choice}
        explanation: {type: string, nullable: true}
    WorkflowInput:
      type: object
      required: [lanes, nodes, edges]
      properties:
        lanes: {type: array, items: {type: string}}
        nodes:
          type: array
          items:
            type: object
            required: [key, lane, kind, title]
            properties:
              key: {type: string}
              lane: {type: string}
              kind: {type: string, enum: [start_event, task, end_event]}
              title: {type: string}
              description: {type: string, nullable: true}
              taskType: {type: string, enum: [software, manual], nullable: true}
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: {type: string}
              to: {type: string}
    Document:
      type: object
      required: [title, sections]
      properties:
        title: {type: string}
        sections:
          type: array
          items:
            type: object
            required: [heading, paragraphs, bullets]
            properties:
              heading: {type: string}
              paragraphs: {type: array, items: {type: string}}
              bullets: {type: array, items: {type: string}}
    SaveAnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId]
            properties:
              questionId: {type: string, format: uuid}
              acceptProposal:
                type: boolean
                description: When true the proposal is the answer and decidedBy is ai; value is ignored
              value:
                description: The client's answer, a string, or an array of strings for multiple_choice
    Requirements:
      type: object
      required: [epics]
      properties:
        epics:
          type: array
          items:
            type: object
            required: [key, name, domainName, requirements]
            properties:
              key: {type: string}
              name: {type: string}
              domainName: {type: string}
              requirements:
                type: array
                items:
                  type: object
                  required: [key, type, priority, text]
                  properties:
                    key: {type: string}
                    type: {type: string, enum: [functional, quality, constraint]}
                    priority: {type: string, enum: [must, should, could, wont]}
                    text: {type: string}
                    source: {type: string, nullable: true}
    Workflow:
      type: object
      required: [id, projectId, status, version, lanes, nodes, edges]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        status: {type: string, enum: [valid, confirmed]}
        version: {type: integer}
        confirmedContractVersion:
          type: integer
          nullable: true
          description: Latest confirmed contract version of the project, if any
        lanes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
        nodes:
          type: array
          items:
            type: object
            required: [id, laneId, kind, title, posX, posY]
            properties:
              id: {type: string, format: uuid}
              laneId: {type: string, format: uuid}
              kind: {type: string, enum: [start_event, task, end_event]}
              title: {type: string}
              description: {type: string, nullable: true}
              taskType: {type: string, nullable: true, enum: [software, manual]}
              posX: {type: integer}
              posY: {type: integer}
        edges:
          type: array
          items:
            type: object
            required: [id, source, target]
            properties:
              id: {type: string, format: uuid}
              source: {type: string, format: uuid}
              target: {type: string, format: uuid}
    Checkpoint:
      type: object
      required: [sha, message, committedAt, fileCount, files]
      properties:
        sha: {type: string}
        message: {type: string}
        committedAt: {type: string, format: date-time}
        fileCount: {type: integer}
        files:
          type: array
          items:
            type: object
            required: [path, added, removed, binary]
            properties:
              path: {type: string}
              added: {type: integer}
              removed: {type: integer}
              binary: {type: boolean}
    WorkspaceFile:
      type: object
      required: [path, size]
      properties:
        path: {type: string}
        size: {type: integer, format: int64}
    WorkspaceFileContent:
      type: object
      required: [path, size, binary, tooLarge]
      properties:
        path: {type: string}
        size: {type: integer, format: int64}
        binary: {type: boolean}
        tooLarge: {type: boolean}
        content: {type: [string, "null"]}
    RunReport:
      type: object
      required: [runId, status, startedAt, seconds, costUsd, costLimitUsd, resumeCount, tasksDone, tasksTotal, stepsDone, stepsTotal, attempts, checkpoints, tasks, questions]
      properties:
        runId: {type: string, format: uuid}
        status: {type: string, enum: [preparing, executing, waiting, done, interrupted, failed]}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time, nullable: true}
        seconds: {type: integer, description: From start to finish (to now while the run is under way)}
        costUsd: {type: number}
        costLimitUsd: {type: number}
        resumeCount: {type: integer}
        tasksDone: {type: integer}
        tasksTotal: {type: integer}
        stepsDone: {type: integer}
        stepsTotal: {type: integer}
        attempts: {type: integer, description: Claude Code invocations over all steps}
        checkpoints: {type: integer, description: Steps with a git commit in the workspace}
        tasks:
          type: array
          items:
            type: object
            required: [title, status, steps]
            properties:
              title: {type: string}
              status: {type: string}
              steps:
                type: array
                items:
                  type: object
                  required: [title, status, attempts, costUsd, seconds]
                  properties:
                    title: {type: string}
                    status: {type: string}
                    attempts: {type: integer}
                    costUsd: {type: number}
                    seconds: {type: integer}
                    commit: {type: string, nullable: true}
        questions:
          type: array
          description: What the run asked the client, and what the client answered
          items:
            type: object
            required: [stepTitle, question, askedAt]
            properties:
              stepTitle: {type: string}
              question: {type: string}
              choice: {type: string, nullable: true, enum: [retry, skip, stop]}
              hint: {type: string, nullable: true}
              askedAt: {type: string, format: date-time}
    Run:
      type: object
      required: [id, projectId, contractVersion, harness, status, costUsd, costLimitUsd, lastSeq, startedAt, tasks]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        contractVersion: {type: integer}
        harness:
          type: string
          enum: [claude_code, gemini_cli]
          description: The builder the run started with (snapshot; a resume uses the same one)
        status:
          type: string
          enum: [preparing, executing, waiting, done, interrupted, failed]
          description: >
            waiting = the run waits, see waitKind (the reason is in failureReason); interrupted =
            the engine restarted while the run was under way (the key is gone), resume continues it;
            failed = only ever the client's stop (or a third interruption after the resumes)
        failureReason: {type: string, nullable: true}
        resumeCount:
          type: integer
          description: How many times the run was resumed after an engine restart (at most 3)
        waitKind:
          type: string
          nullable: true
          enum: [question, cost_limit, tokens]
          description: >
            Only while status is waiting. question = a defect is not fixable after the fix attempts
            and the client must answer (`question`); cost_limit = the limit is reached, the client
            raises it (resume); tokens = the rate limit or the credit is exhausted: the run retries
            by itself with doubling waits (1 minute at first, 15 minutes at most) and, after 6 tries, waits for
            resume
        question:
          type: object
          nullable: true
          required: [id, text, stepTitle, options]
          description: The open question, present when waitKind is question
          properties:
            id: {type: string, format: uuid}
            text: {type: string}
            stepTitle: {type: string}
            options:
              type: array
              items: {type: string, enum: [retry, skip, stop]}
        costUsd: {type: number, description: Sum of the Claude Code invocations so far}
        costLimitUsd: {type: number}
        lastSeq: {type: integer, format: int64}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time, nullable: true}
        tasks:
          type: array
          items:
            type: object
            required: [id, seq, title, status, steps]
            properties:
              id: {type: string, format: uuid}
              seq: {type: integer}
              title: {type: string}
              lane: {type: string, nullable: true}
              status: {type: string, enum: [pending, running, done, failed]}
              steps:
                type: array
                items:
                  type: object
                  required: [id, seq, key, title, status, costUsd]
                  properties:
                    id: {type: string, format: uuid}
                    seq: {type: integer}
                    key: {type: string}
                    title: {type: string}
                    status: {type: string, enum: [waiting, running, done, failed]}
                    result: {type: string, nullable: true}
                    costUsd: {type: number, description: Always 0 with Gemini CLI (free tier)}
                    tokens: {type: integer, format: int64, description: Tokens of the builder invocations (reported by Gemini CLI; 0 for Claude Code)}
                    turns: {type: integer}
                    seconds: {type: integer}
                    attempts:
                      type: integer
                      description: >
                        Builder invocations so far (the first try and the fix attempts); every one
                        is recorded as an agent call
                    commit: {type: string, nullable: true}
    Builders:
      type: object
      required: [demo, builders]
      properties:
        demo: {type: boolean}
        builders:
          type: array
          items:
            type: object
            required: [id, name, ready, installed, version, keySet, model, missing]
            properties:
              id: {type: string, enum: [claude_code, gemini_cli]}
              name: {type: string}
              ready: {type: boolean, description: Nothing is missing; a run with this builder may start}
              installed: {type: boolean}
              version: {type: string}
              signedIn:
                type: string
                nullable: true
                enum: [yes, no, unknown]
                description: Claude Code in machine_sign_in mode only
              keySet: {type: boolean, description: The Anthropic key (Claude Code) or the Gemini key (Gemini CLI) is set}
              authMode:
                type: string
                nullable: true
                enum: [anthropic_key, machine_sign_in]
                description: Claude Code only
              model: {type: string}
              missing:
                type: array
                items:
                  type: object
                  required: [code, message]
                  properties:
                    code: {type: string, enum: [claude_not_installed, no_anthropic_key, not_signed_in, gemini_not_installed, no_gemini_key]}
                    message: {type: string}
                    instructionKey: {type: string, nullable: true}
    RunEvent:
      type: object
      required: [seq, kind, text, at]
      properties:
        seq: {type: integer, format: int64}
        kind: {type: string, enum: [run, task, step, console]}
        text: {type: string}
        at: {type: string, format: date-time}
    Contract:
      type: object
      required: [id, projectId, version, confirmedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        version: {type: integer}
        confirmedAt: {type: string, format: date-time}
    EngineStatus:
      type: object
      required: [name, buildId, serverTime, aiStub]
      properties:
        aiStub:
          type: boolean
          description: True in demo mode (ENGINE_AI_STUB): the AI answers are canned, not real
        name:
          type: string
        buildId:
          type: string
          description: The build that runs; "dev" for a local build without BUILD_ID
        serverTime:
          type: string
          format: date-time
          description: UTC
    AiCheckRequest:
      type: object
      description: Without apiKey the saved key of the provider is tested
      properties:
        provider:
          type: string
          enum: [anthropic, openai]
          description: Default anthropic
        apiKey:
          type: string
        baseUrl:
          type: string
        model:
          type: string
    KeyState:
      type: object
      required: [set, last4]
      properties:
        set:
          type: boolean
        last4:
          type: string
          nullable: true
          description: The last 4 characters of the key; empty for a short key, null when no key is set
    CompatibleKeyState:
      type: object
      required: [set, last4, baseUrl, model]
      properties:
        set:
          type: boolean
        last4:
          type: string
          nullable: true
        baseUrl:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
    AiKeys:
      type: object
      required: [anthropic, openai, planning, defaults]
      properties:
        anthropic:
          $ref: "#/components/schemas/KeyState"
        openai:
          $ref: "#/components/schemas/CompatibleKeyState"
        planning:
          type: object
          nullable: true
          description: What the planning calls use now (null when no key is set); builds always use Claude Code
          properties:
            provider:
              type: string
              enum: [anthropic, openai]
            model:
              type: string
        defaults:
          type: object
          properties:
            baseUrl:
              type: string
            model:
              type: string
    SetAiKeyRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
        baseUrl:
          type: string
        model:
          type: string
    AiCheckResult:
      type: object
      required: [ok, model]
      properties:
        ok:
          type: boolean
        model:
          type: string
          description: The model that answered the check
    StepDef:
      type: object
      required: [key, title, gated, capUsd, prompt]
      properties:
        key: {type: string, pattern: "^[a-z0-9-]{1,40}$"}
        title: {type: string, maxLength: 80}
        gated: {type: boolean, description: The orchestrator runs ./check.sh after the step and it must pass}
        capUsd: {type: number, exclusiveMinimum: 0, maximum: 10}
        prompt: {type: string, maxLength: 4000, description: "What Claude is told; {task} stands for the task title"}
    StepProfile:
      type: object
      required: [id, name, description, isDefault, seeded, steps]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        isDefault: {type: boolean}
        seeded: {type: boolean, description: Seeded profiles are read-only; copy one to edit}
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepDef"
    StepProfileEdit:
      type: object
      required: [name, steps]
      properties:
        name: {type: string, maxLength: 60}
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/StepDef"
    ProjectSettings:
      type: object
      required: [stepProfileId, stepProfileName, costLimitUsd, defaultCostLimitUsd, usesDefaultProfile, usesDefaultLimit]
      properties:
        stepProfileId: {type: string, format: uuid, description: The profile a run uses now (the default when none was chosen)}
        stepProfileName: {type: string}
        usesDefaultProfile: {type: boolean}
        costLimitUsd: {type: number, description: The limit a run uses now}
        defaultCostLimitUsd: {type: number}
        usesDefaultLimit: {type: boolean}
    Problem:
      description: Error format of every operation (RFC 9457, application/problem+json)
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
