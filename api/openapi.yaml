openapi: 3.0.3
info:
  title: Workflow Engine API
  version: 0.1.0
  description: Written first; the backend and the frontend follow this file.
servers:
  - url: /
paths:
  /api/status:
    get:
      operationId: getStatus
      summary: Name, build id and time of the running engine
      responses:
        "200":
          description: The engine answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatus"
  /api/ai/check:
    post:
      operationId: checkAiConnection
      summary: Keep the user's Anthropic key for the session and make one tiny call with it
      description: >
        The key is held in engine memory only (never stored, never logged). On success the key
        stays for the session; on failure it is discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCheckRequest"
      responses:
        "200":
          description: Claude answered with this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCheckResult"
        "400":
          description: No key given
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Anthropic rejected the key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic could not be reached or failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects:
    post:
      operationId: createProject
      summary: Create a project from a wish; the Anthropic key, if given, is kept for the session
      description: The key is held in engine memory only (never stored, never logged).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: The project exists (status draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The wish is empty or too long
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listProjects
      summary: "All projects, newest first (no login, everyone sees all)"
      responses:
        "200":
          description: The projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /api/projects/{id}:
    get:
      operationId: getProject
      summary: One project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/workflow:
    post:
      operationId: generateWorkflow
      summary: Claude writes the business workflow from the wish, the answers and the requirements (one planning call, one retry; needs the requirements)
      description: >
        Replaces the draft workflow of the project; its status becomes valid. A confirmed
        contract is never touched.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The validated workflow with positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          description: Anthropic rejected the key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No Anthropic key is set for this session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Anthropic rate limit or credit exhausted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic failed, or the workflow was invalid twice
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getWorkflow
      summary: The current workflow of the project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: No such project, or no workflow yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/workflow/confirm:
    post:
      operationId: confirmWorkflow
      summary: Freeze the valid workflow as the next contract version
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: The new contract version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No workflow, or it is already confirmed and unchanged
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/contracts:
    get:
      operationId: listContracts
      summary: The confirmed contract versions of the project, oldest first
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/brief:
    post:
      operationId: generateBrief
      summary: Write the brief of the wish (one Claude call; only while the project is a draft)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The Anthropic key was rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No key, or the project is not at the right step
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Anthropic rate limit or credit used up
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic failed, or the answer was invalid twice
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getBrief
      summary: The brief of the project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: No such project, or no brief yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/questions:
    post:
      operationId: generateQuestions
      summary: Research the wish and ask at most 8 questions, each with the AI proposal (replaces earlier questions; needs the brief)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The questions; project status questions_ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The Anthropic key was rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No key, or the project is not at the right step
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Anthropic rate limit or credit used up
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic failed, or the answer was invalid twice
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getQuestions
      summary: The questions of the project with the answers given so far
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The questions (empty list when none were asked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/answers:
    put:
      operationId: saveAnswers
      summary: Save one answer for every question (the client's value, or the AI proposal); project status answered
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAnswersRequest"
      responses:
        "200":
          description: The questions with their answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        "400":
          description: An answer is missing or not one of the options
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: There are no questions, or the requirements are already written
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/requirements:
    post:
      operationId: generateRequirements
      summary: Write the requirements from the wish and the answers (replaces earlier ones); project status requirements_ready
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The requirements grouped by epic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirements"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The Anthropic key was rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: No key, or the project is not at the right step
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Anthropic rate limit or credit used up
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Anthropic failed, or the answer was invalid twice
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getRequirements
      summary: The requirements of the project (no epics when none were written)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The requirements grouped by epic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirements"
        "404":
          description: No such project
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateProjectRequest:
      type: object
      required: [wish]
      properties:
        wish:
          type: string
          maxLength: 20000
        apiKey:
          type: string
          description: Optional; kept in memory for the session
    Project:
      type: object
      required: [id, name, wish, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: The start of the wish}
        wish: {type: string}
        status:
          type: string
          enum: [draft, questions_ready, answered, requirements_ready, workflow_drafted, confirmed, executing, done, stopped, failed]
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Brief:
      type: object
      required: [goal, actors, domainTerms, risks]
      properties:
        goal: {type: string}
        actors: {type: array, items: {type: string}}
        domainTerms: {type: array, items: {type: string}}
        risks: {type: array, items: {type: string}}
    Questions:
      type: array
      maxItems: 8
      items:
        $ref: "#/components/schemas/Question"
    Question:
      type: object
      required: [id, seq, category, answerType, text, options, proposal]
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        category: {type: string, enum: [requirement, feature]}
        answerType: {type: string, enum: [single_choice, multiple_choice, text]}
        text: {type: string}
        options: {type: array, items: {type: string}}
        proposal:
          description: The AI's proposed answer, preselected for the client; a string, or an array of strings for multiple_choice
        explanation: {type: string, nullable: true}
        answer:
          nullable: true
          type: object
          required: [value, decidedBy]
          properties:
            value:
              description: A string, or an array of strings for multiple_choice
            decidedBy: {type: string, enum: [client, ai]}
    SaveAnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId]
            properties:
              questionId: {type: string, format: uuid}
              acceptProposal:
                type: boolean
                description: When true the proposal is the answer and decidedBy is ai; value is ignored
              value:
                description: The client's answer, a string, or an array of strings for multiple_choice
    Requirements:
      type: object
      required: [epics]
      properties:
        epics:
          type: array
          items:
            type: object
            required: [key, name, domainName, requirements]
            properties:
              key: {type: string}
              name: {type: string}
              domainName: {type: string}
              requirements:
                type: array
                items:
                  type: object
                  required: [key, type, priority, text]
                  properties:
                    key: {type: string}
                    type: {type: string, enum: [functional, quality, constraint]}
                    priority: {type: string, enum: [must, should, could, wont]}
                    text: {type: string}
                    source: {type: string, nullable: true}
    Workflow:
      type: object
      required: [id, projectId, status, version, lanes, nodes, edges]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        status: {type: string, enum: [valid, confirmed]}
        version: {type: integer}
        confirmedContractVersion:
          type: integer
          nullable: true
          description: Latest confirmed contract version of the project, if any
        lanes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
        nodes:
          type: array
          items:
            type: object
            required: [id, laneId, kind, title, posX, posY]
            properties:
              id: {type: string, format: uuid}
              laneId: {type: string, format: uuid}
              kind: {type: string, enum: [start_event, task, end_event]}
              title: {type: string}
              description: {type: string, nullable: true}
              taskType: {type: string, nullable: true, enum: [software, manual]}
              posX: {type: integer}
              posY: {type: integer}
        edges:
          type: array
          items:
            type: object
            required: [id, source, target]
            properties:
              id: {type: string, format: uuid}
              source: {type: string, format: uuid}
              target: {type: string, format: uuid}
    Contract:
      type: object
      required: [id, projectId, version, confirmedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        version: {type: integer}
        confirmedAt: {type: string, format: date-time}
    EngineStatus:
      type: object
      required: [name, buildId, serverTime]
      properties:
        name:
          type: string
        buildId:
          type: string
          description: The build that runs; "dev" for a local build without BUILD_ID
        serverTime:
          type: string
          format: date-time
          description: UTC
    AiCheckRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          minLength: 1
    AiCheckResult:
      type: object
      required: [ok, model]
      properties:
        ok:
          type: boolean
        model:
          type: string
          description: The model that answered the check
    Problem:
      description: Error format of every operation (RFC 9457, application/problem+json)
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
