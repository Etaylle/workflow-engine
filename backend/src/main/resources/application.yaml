spring:
  application:
    name: workflow-engine
  datasource:
    url: ${ENGINE_DB_URL:jdbc:postgresql://localhost:5432/engine}
    username: ${ENGINE_DB_USER:engine}
    password: ${ENGINE_DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${ENGINE_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
